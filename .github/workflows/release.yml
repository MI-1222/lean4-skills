name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g., v1.0.0, v0.1.0-alpha)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tag name and release kind
        id: vars
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          echo "tag_name=${TAG}" >> "$GITHUB_OUTPUT"

          # タグ名にハイフンが含まれる場合はプレリリースと判定 (例: v1.0.0-rc1, v0.1.0-alpha)
          if [[ "$TAG" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Package release archive
        shell: bash
        run: |
          set -euo pipefail
          STAGE_DIR="$RUNNER_TEMP/package_stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          if [ -d "skills" ]; then
            cp -r skills "$STAGE_DIR/"
          fi

          for doc in README.md LICENSE; do
            if [ -f "$doc" ]; then
              cp "$doc" "$STAGE_DIR/"
            fi
          done

          (cd "$STAGE_DIR" && zip -r "$GITHUB_WORKSPACE/lean4-skills.zip" .)

      - name: Verify package contents (Smoke Test)
        shell: bash
        run: |
          set -euo pipefail
          VERIFY_DIR="$RUNNER_TEMP/package_verify"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"

          # 作成した zip を展開
          unzip -q lean4-skills.zip -d "$VERIFY_DIR"

          echo "=== Zip Archive Contents ==="
          unzip -l lean4-skills.zip

          # 禁止ファイル・ディレクトリ(.git, .github等)が含まれていないか検証
          echo "=== Verifying no restricted paths leaked ==="
          for forbidden in .git .github; do
            if [ -e "$VERIFY_DIR/$forbidden" ]; then
              echo "::error::Forbidden path '$forbidden' found in release archive!"
              exit 1
            fi
          done

          echo "Verification passed: Archive is clean and valid."

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.vars.outputs.tag_name }}
          PRERELEASE: ${{ steps.vars.outputs.prerelease }}
          MAKE_LATEST: ${{ steps.vars.outputs.make_latest }}
        run: |
          EXTRA_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            EXTRA_ARGS+=(--prerelease)
          fi
          if [ "$MAKE_LATEST" = "true" ]; then
            EXTRA_ARGS+=(--latest)
          else
            EXTRA_ARGS+=(--latest=false)
          fi

          gh release create "$TAG_NAME" lean4-skills.zip \
            --title "Release $TAG_NAME" \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
